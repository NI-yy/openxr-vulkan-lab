plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.niyy.openxrvulkanlab'
    compileSdk 34
    buildToolsVersion '34.0.0'
    ndkVersion '23.2.8568313'

    defaultConfig {
        applicationId 'dev.niyy.openxrvulkanlab'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                if (System.getenv('OPENXR_SDK_SOURCE_DIR')) {
                    arguments "-DFETCHCONTENT_SOURCE_DIR_OPENXRSDK=${System.getenv('OPENXR_SDK_SOURCE_DIR')}"
                }
                targets 'openxr_vulkan_lab'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
